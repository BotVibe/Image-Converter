server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation. Unlocks SharedArrayBuffer, which @jsquash needs for
    # the multithreaded AVIF encoder (assets/avif_enc_mt.wasm + its worker).
    # GitHub Pages cannot set headers, so it always ran single-threaded there.
    # Safe here: the app is privacy-first and loads no cross-origin subresources.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin"  always;
    add_header X-Content-Type-Options       "nosniff"      always;
    add_header Referrer-Policy              "no-referrer"  always;
    # index.html must not be cached, or clients pin stale asset hashes.
    add_header Cache-Control                "no-cache"     always;

    # The .wasm payloads are ~3.4 MB raw / ~1.1 MB gzipped. Without this they go
    # over the wire uncompressed.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        application/manifest+json
        image/svg+xml;

    # Vite fingerprints everything under assets/, so it is safe to cache forever.
    # nginx drops inherited add_header directives in a location that declares its
    # own, so every header above has to be repeated here.
    location /assets/ {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin"  always;
        add_header X-Content-Type-Options       "nosniff"      always;
        add_header Referrer-Policy              "no-referrer"  always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        try_files $uri =404;
    }

    # No SPA fallback on purpose: this app has no client-side routing, and a
    # try_files ... /index.html catch-all would turn missing assets into silent
    # HTTP 200s serving HTML — which is exactly how the webfont 404 stayed hidden.
    location / {
        try_files $uri $uri/ =404;
    }
}
